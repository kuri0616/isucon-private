server {
  listen 80;

  client_max_body_size 10m;
  root /public/;

  # location 同士は設定を継承しないので server レベルに置く
  proxy_set_header Host $host;

  # 画像は public/image/ から静的に返す。
  # 未生成のものだけアプリに回し、そこで DB から書き出される
  location /image/ {
    expires 1d;
    try_files $uri @app;
  }

  # try_files はディレクトリ扱いで 403 を返すので潰しておく
  location = /image/ {
    return 404;
  }

  location / {
    proxy_pass http://app:8080;
  }

  # 名前付き location では proxy_pass に URI 部分を書けない (末尾スラッシュ不可)
  location @app {
    proxy_pass http://app:8080;
  }
}
